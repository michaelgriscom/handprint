# Tag a version (git tag v0.2.0 && git push --tags) to publish the browser build
# as a release asset. Sites embed it by downloading app.js from the release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - uses: softprops/action-gh-release@v2
        with:
          files: web-dist/app.js
          generate_release_notes: true
